<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工件计数+环境监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #1a202c;
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        /* 物料展示区域 */
        .material-display-inline {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 8px 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 25px;
            color: white;
            font-weight: bold;
        }

        .material-shape-small {
            width: 35px;
            height: 35px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #666;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .material-shape-small.square {
            border-radius: 8px;
        }

        .material-shape-small.empty {
            border-radius: 8px;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            background: transparent;
        }

        .material-placeholder {
            visibility: hidden;
            pointer-events: none;
        }

        /* 环境传感器样式 */
        .sensor-section {
            margin-bottom: 30px;
            padding: 24px;
            background: #f7fafc;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
        }

        .sensor-title {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #edf2f7;
            font-weight: 600;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }

        .sensor-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .sensor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05);
        }

        .sensor-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .sensor-label {
            font-size: 15px;
            color: #718096;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .sensor-value {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .sensor-unit {
            font-size: 13px;
            color: #a0aec0;
        }

        .flooding-normal {
            color: #48bb78;
        }

        .flooding-alarm {
            color: #fc8181;
        }

        /* 执行器控制区域样式 */
        .actuator-section {
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .actuator-title {
            color: white;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .actuator-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .actuator-group {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
        }

        .group-title {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .control-label {
            font-size: 13px;
            color: #666;
        }

        .auto-button {
            padding: 6px 16px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 60px;
        }

        .auto-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .auto-button.active {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }

        .mode-select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .color-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .color-input-group {
            flex: 1;
            text-align: center;
        }

        .color-input-group label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 3px;
        }

        .color-input-group input {
            width: 100%;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 12px;
            outline: none;
        }

        /* 主内容布局 - 核心修复对齐 */
        .main-content {
            display: flex;
            gap: 24px;
            justify-content: space-between;
            align-items: stretch;
        }

        .stats-section {
            flex: 1;
            min-width: 0;
            width: 50%;
            display: flex;
            flex-direction: column;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }

        .section-title {
            color: #333;
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card.qualified {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.3);
        }

        .stat-card.circle-theme {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3);
        }

        .stat-card.square-theme {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 8px 20px rgba(250, 112, 154, 0.3);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .stat-unit {
            font-size: 12px;
            opacity: 0.8;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .chart-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .chart-canvas {
            max-width: 100%;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* 响应式适配 */
        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }
            .stats-section {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 16px;
            }
            .header h1 {
                font-size: 24px;
            }
            .stat-value {
                font-size: 28px;
            }
            .actuator-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏭 工件计数+环境监控系统</h1>
            <p>实时监控工件生产质量数据 & 环境传感器数据</p>
        </div>

        <!-- 环境传感器展示区域 -->
        <div class="sensor-section">
            <h2 class="sensor-title">🌡️ 环境传感器数据</h2>
            <div class="sensor-grid">
                <div class="sensor-card">
                    <div class="sensor-icon">💡</div>
                    <div class="sensor-label">光照度</div>
                    <div class="sensor-value" id="illuminance">0</div>
                    <div class="sensor-unit">lux</div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-icon">🌫️</div>
                    <div class="sensor-label">PM2.5</div>
                    <div class="sensor-value" id="pm2_5">0</div>
                    <div class="sensor-unit">μg/m³</div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-icon">🌫️</div>
                    <div class="sensor-label">PM10</div>
                    <div class="sensor-value" id="pm10">0</div>
                    <div class="sensor-unit">μg/m³</div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-icon">🌫️</div>
                    <div class="sensor-label">PM1</div>
                    <div class="sensor-value" id="pm1">0</div>
                    <div class="sensor-unit">μg/m³</div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-icon">💧</div>
                    <div class="sensor-label">浸水状态</div>
                    <div class="sensor-value" id="flooding">正常</div>
                    <div class="sensor-unit"></div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-icon">🌡️</div>
                    <div class="sensor-label">温度</div>
                    <div class="sensor-value" id="wendu">0.0</div>
                    <div class="sensor-unit">℃</div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-icon">💦</div>
                    <div class="sensor-label">湿度</div>
                    <div class="sensor-value" id="shidu">0.0</div>
                    <div class="sensor-unit">%</div>
                </div>
            </div>
        </div>

        <!-- 执行器控制区域 -->
        <div class="actuator-section">
            <h2 class="actuator-title">🎛️ 执行器控制</h2>
            <div class="actuator-grid">
                <!-- 温湿度自动化控制 -->
                <div class="actuator-group">
                    <h3 class="group-title">温湿度自动化</h3>
                    <div class="control-row">
                        <span class="control-label">温度自动化</span>
                        <button class="auto-button" id="wdAutoBtn" onclick="toggleAuto('wd_auto')">
                            <span class="button-text">关闭</span>
                        </button>
                    </div>
                    <div class="control-row">
                        <span class="control-label">湿度自动化</span>
                        <button class="auto-button" id="sdAutoBtn" onclick="toggleAuto('sd_auto')">
                            <span class="button-text">关闭</span>
                        </button>
                    </div>
                </div>

                <!-- RGB灯带控制 -->
                <div class="actuator-group">
                    <h3 class="group-title">RGB灯带控制</h3>
                    <div class="control-row">
                        <span class="control-label">灯带开关</span>
                        <button class="auto-button" id="rgbSwitchBtn" onclick="toggleRGB('RGB')">
                            <span class="button-text">关闭</span>
                        </button>
                    </div>
                    <div class="control-row">
                        <span class="control-label">灯带模式</span>
                        <select class="mode-select" id="rgbModeSelect" onchange="setRGBMode(this.value)">
                            <option value="0">常亮</option>
                            <option value="1">呼吸</option>
                            <option value="2">流水灯</option>
                            <option value="3">跑马灯</option>
                        </select>
                    </div>
                    <div class="color-controls">
                        <div class="color-input-group">
                            <label>🔴 红</label>
                            <input type="number" min="0" max="255" value="0" id="redInput"
                                   onchange="setRGBColor('RGB_color_red', this.value)">
                        </div>
                        <div class="color-input-group">
                            <label>🟢 绿</label>
                            <input type="number" min="0" max="255" value="0" id="greenInput"
                                   onchange="setRGBColor('RGB_color_green', this.value)">
                        </div>
                        <div class="color-input-group">
                            <label>🔵 蓝</label>
                            <input type="number" min="0" max="255" value="255" id="blueInput"
                                   onchange="setRGBColor('RGB_color_blue', this.value)">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 工件统计主区域 - 核心修复结构 -->
        <div class="main-content">
            <!-- 圆形工件统计区域 -->
            <div class="stats-section">
                <div class="section-header">
                    <h2 class="section-title">⭕ 圆形工件统计</h2>
                    <!-- <div class="material-display-inline" id="materialInline">
                        <div class="material-shape-small empty" id="materialShape"></div>
                        <span class="material-name-small" id="materialName">无物料</span>
                    </div> -->
                </div>
                <div class="stats-grid">
                    <div class="stat-card circle-theme">
                        <div class="stat-icon">📦</div>
                        <div class="stat-label">工件总数</div>
                        <div class="stat-value" id="circleTotal">0</div>
                        <div class="stat-unit">件</div>
                    </div>
                    <div class="stat-card circle-theme qualified">
                        <div class="stat-icon">✅</div>
                        <div class="stat-label">合格数量</div>
                        <div class="stat-value" id="circleQualified">0</div>
                        <div class="stat-unit">件</div>
                    </div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">合格率</div>
                    <canvas id="circleChart" class="chart-canvas" width="200" height="200"></canvas>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #38ef7d;"></div>
                            <span>合格</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ff6b6b;"></div>
                            <span>不合格</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 方形工件统计区域 - 完全独立对称结构 -->
            <div class="stats-section">
                <div class="section-header">
                    <h2 class="section-title">⬜ 方形工件统计</h2>
                    <div class="material-display-inline material-placeholder"></div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card square-theme">
                        <div class="stat-icon">📦</div>
                        <div class="stat-label">工件总数</div>
                        <div class="stat-value" id="squareTotal">0</div>
                        <div class="stat-unit">件</div>
                    </div>
                    <div class="stat-card square-theme qualified">
                        <div class="stat-icon">✅</div>
                        <div class="stat-label">合格数量</div>
                        <div class="stat-value" id="squareQualified">0</div>
                        <div class="stat-unit">件</div>
                    </div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">合格率</div>
                    <canvas id="squareChart" class="chart-canvas" width="200" height="200"></canvas>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #38ef7d;"></div>
                            <span>合格</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ff6b6b;"></div>
                            <span>不合格</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 饼图绘制函数
        function drawPieChart(canvasId, qualified, total) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 80;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 无数据时显示0%
            if (total === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e9ecef';
                ctx.fill();

                ctx.fillStyle = '#999';
                ctx.font = 'bold 16px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('0.00%', centerX, centerY);
                return;
            }

            // 计算比例
            const qualifiedRate = qualified / total;
            const unqualifiedRate = 1 - qualifiedRate;
            const startAngle = -Math.PI / 2;
            const qualifiedAngle = startAngle + (2 * Math.PI * qualifiedRate);

            // 绘制合格部分
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, qualifiedAngle);
            ctx.closePath();
            ctx.fillStyle = '#38ef7d';
            ctx.fill();

            // 绘制不合格部分
            if (unqualifiedRate > 0) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, qualifiedAngle, startAngle + 2 * Math.PI);
                ctx.closePath();
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
            }

            // 绘制中心镂空
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.6, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();

            // 绘制百分比文字
            const percentage = (qualifiedRate * 100).toFixed(2);
            ctx.fillStyle = '#333';
            ctx.font = 'bold 20px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(percentage + '%', centerX, centerY);
        }

        // 自动化开关按钮状态更新
        function updateAutoButton(autoType, value) {
            const button = document.getElementById(autoType === 'wd_auto' ? 'wdAutoBtn' : 'sdAutoBtn');
            const buttonText = button.querySelector('.button-text');
            if (value === 1) {
                button.classList.add('active');
                buttonText.textContent = '开启';
            } else {
                button.classList.remove('active');
                buttonText.textContent = '关闭';
            }
        }

        // 切换自动化开关
        function toggleAuto(autoType) {
            const apiUrl = window.location.origin + '/api/toggle_auto/' + autoType;
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    updateAutoButton(autoType, data.value);
                } else {
                    alert('切换失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('切换自动化失败:', error);
                alert('切换失败，请重试');
            });
        }

        // 更新RGB灯带开关按钮显示
        function updateRGBButton(value) {
            const button = document.getElementById('rgbSwitchBtn');
            const buttonText = button.querySelector('.button-text');
            if (value === 1) {
                button.classList.add('active');
                buttonText.textContent = '开启';
            } else {
                button.classList.remove('active');
                buttonText.textContent = '关闭';
            }
        }

        // 切换RGB灯带开关
        function toggleRGB(paramName) {
            const currentVal = document.getElementById('rgbSwitchBtn').classList.contains('active') ? 1 : 0;
            const newVal = currentVal === 1 ? 0 : 1;
            const apiUrl = window.location.origin + '/api/rgb_control/' + paramName;
            
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({value: newVal})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    updateRGBButton(newVal);
                } else {
                    alert('切换失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('切换RGB开关失败:', error);
                alert('切换失败，请重试');
            });
        }

        // 设置RGB灯带模式
        function setRGBMode(value) {
            const apiUrl = window.location.origin + '/api/rgb_control/RGB_mode';
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({value: parseInt(value)})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'ok') {
                    alert('设置模式失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('设置RGB模式失败:', error);
                alert('设置失败，请重试');
            });
        }

        // 设置RGB颜色值
        function setRGBColor(paramName, value) {
            value = parseInt(value);
            if (isNaN(value) || value < 0 || value > 255) {
                alert('颜色值必须在0-255之间');
                return;
            }
            const apiUrl = window.location.origin + '/api/rgb_control/' + paramName;
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({value: value})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'ok') {
                    alert('设置颜色失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('设置RGB颜色失败:', error);
                alert('设置失败，请重试');
            });
        }

        // 更新传感器数据
        function updateSensorStats() {
            const apiUrl = window.location.origin + '/api/sensor_stats';
            fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                // 更新传感器数值
                document.getElementById('illuminance').textContent = data.Illuminance || 0;
                document.getElementById('pm2_5').textContent = data.PM2_5 || 0;
                document.getElementById('pm10').textContent = data.PM10 || 0;
                document.getElementById('pm1').textContent = data.PM1 || 0;

                // 浸水状态
                const floodingEl = document.getElementById('flooding');
                if (data.flooding === 1) {
                    floodingEl.textContent = '正常';
                    floodingEl.className = 'sensor-value flooding-normal';
                } else {
                    floodingEl.textContent = '报警';
                    floodingEl.className = 'sensor-value flooding-alarm';
                }

                // 温湿度
                document.getElementById('wendu').textContent = data.wendu || 0.0;
                document.getElementById('shidu').textContent = data.shidu || 0.0;

                // 自动化按钮状态
                if (data.wd_auto !== undefined) updateAutoButton('wd_auto', data.wd_auto);
                if (data.sd_auto !== undefined) updateAutoButton('sd_auto', data.sd_auto);

                // RGB控制状态
                if (data.RGB !== undefined) updateRGBButton(data.RGB);
                if (data.RGB_mode !== undefined) document.getElementById('rgbModeSelect').value = data.RGB_mode;
                if (data.RGB_color_red !== undefined) document.getElementById('redInput').value = data.RGB_color_red;
                if (data.RGB_color_green !== undefined) document.getElementById('greenInput').value = data.RGB_color_green;
                if (data.RGB_color_blue !== undefined) document.getElementById('blueInput').value = data.RGB_color_blue;
            })
            .catch(error => console.error('获取传感器数据失败:', error));
        }

        // 更新工件统计数据
        function updateWorkpieceStats() {
            const apiUrl = window.location.origin + '/api/stats';
            fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                // 更新物料显示
                // const materialShape = document.getElementById('materialShape');
                // const materialName = document.getElementById('materialName');
                // if (data.current_material === 0) {
                //     materialShape.className = 'material-shape-small empty';
                //     materialShape.textContent = '';
                //     materialName.textContent = '无物料';
                // } else if (data.current_material === 1) {
                //     materialShape.className = 'material-shape-small';
                //     materialShape.textContent = '⭕';
                //     materialName.textContent = '圆形物料';
                // } else if (data.current_material === 2) {
                //     materialShape.className = 'material-shape-small square';
                //     materialShape.textContent = '⬜';
                //     materialName.textContent = '方形物料';
                // }

                // 更新圆形工件数据
                document.getElementById('circleTotal').textContent = data.circle_total;
                document.getElementById('circleQualified').textContent = data.circle_qualified;
                drawPieChart('circleChart', data.circle_qualified, data.circle_total);

                // 更新方形工件数据
                document.getElementById('squareTotal').textContent = data.square_total;
                document.getElementById('squareQualified').textContent = data.square_qualified;
                drawPieChart('squareChart', data.square_qualified, data.square_total);
            })
            .catch(error => console.error('获取工件数据失败:', error));
        }

        // 初始化
        window.onload = function() {
            updateSensorStats();
            updateWorkpieceStats();
            // 定时刷新数据
            setInterval(updateSensorStats, 1000);
            setInterval(updateWorkpieceStats, 1000);
        };
    </script>
</body>
</html>
